name: Actualizar catálogo

on:
  schedule:
    - cron: "0 11 * * *"   # 6:00 am hora Perú (UTC-5)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar catálogo de Crist Fragances
        run: python3 scripts/refresh_catalog.py
      - name: Publicar si hubo cambios
        run: |
          if git diff --quiet -- data/products.json; then
            echo "Sin cambios en el catálogo."
            exit 0
          fi
          git config user.name "astrabusiness01-import"
          git config user.email "322358985+astrabusiness01-import@users.noreply.github.com"
          git add data/products.json
          git commit -m "Catálogo actualizado automáticamente"
          git push
